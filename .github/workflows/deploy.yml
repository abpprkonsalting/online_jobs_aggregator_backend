name: Deploy Backend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Write production .env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > .env

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | ssh-add -
          chmod 600 .env
          rsync -avz -e "ssh -p $VPS_SSH_PORT -o StrictHostKeyChecking=yes" \
            dist .env package.json package-lock.json "$VPS_USER@$VPS_HOST:/var/www/map_rezi/backend/"
          ssh -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd /var/www/map_rezi/backend && npm ci --omit=dev && sudo systemctl restart map-rezi-api map-rezi-fetcher"
