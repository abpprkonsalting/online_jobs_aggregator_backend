name: Deploy Backend

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore annotated release tag after checkout
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --no-tags origin "$GITHUB_REF:$GITHUB_REF"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Generate deployment version metadata
        env:
          DEPLOYMENT_ENVIRONMENT: production
        run: npm run version:metadata

      - name: Write production .env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: printf '%s' "$BACKEND_ENV" > .env

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | ssh-add -
          chmod 600 .env
          SSH_RSYNC="ssh -p $VPS_SSH_PORT -o StrictHostKeyChecking=yes"
          rsync -avz --delete -e "$SSH_RSYNC" \
            dist/ "$VPS_USER@$VPS_HOST:/var/www/map_rezi/backend/dist/"
          rsync -avz -e "$SSH_RSYNC" \
            .env package.json package-lock.json "$VPS_USER@$VPS_HOST:/var/www/map_rezi/backend/"
          ssh -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd /var/www/map_rezi/backend && chgrp map_rezi .env && chmod 640 .env && npm ci --omit=dev && chgrp -R map_rezi dist node_modules && chmod -R g+rX dist node_modules && chgrp map_rezi package.json package-lock.json && chmod g+r package.json package-lock.json && sudo systemctl restart map-rezi-api map-rezi-fetcher"
